<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Feature Store</title>
  <meta name="description" content="City Feature Store - Conhecendo de Cidades em detalhes">
  <meta name="keywords" content="Feature Store;Cidades">

  <!-- Favicons -->
  <link href="/static/img/simbolo.png" rel="icon">
  <link href="/static/img/simbolo.png" rel="apple-touch-icon">

  <!-- Main CSS File -->
  <link href="/static/css/main.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container-fluid">
  
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        teste
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item active">
            <a class="nav-link" href="{{ url_for('home') }}">Principal</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Bases de dados</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Servicos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contato</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-area" href="{{ url_for('admin') }}">Área restrita</a>
          </li>
        </ul>
      </div>
    </nav>

    <br>
  
    <div class="row justify-content-md-center">

      <div class="col"></div>
      <div class="col"> 
        
        <div class="row justify-content-md-center">
          <div class="col-md-auto"></div>
          <div class="col col-12 registro-container ">
            
            <div class="mb-3 text-center">
              <h3 style="font-family: 'DeFontePlus';">Cria uma nova conta de acesso</h3>
              <p style="font-family: 'DIN';">Você precisa de uma conta para acessar a área restrita</p>
            </div> 
        
            <form name="frmRegistro" id="frmRegistro">

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="informe seu nome">
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@example.com">
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Informe sua senha">
                <div class="form-text">
                  Deve ter pelo menos 8 caracteres e incluir letras maiúsculas, minúsculas, números e caracteres especiais
                </div>
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="senhaconfirmada" class="form-label">Confirme a senha</label>
                <input type="password" class="form-control" id="senhaconfirmada" name="senhaconfirmada" placeholder="Repita sua senha">
              </div>

              <div class="form-check mb-2" style="font-family: 'Plus Normale';">
                <input class="form-check-input" type="checkbox" id="newsletter">
                <label class="form-check-label" for="newsletter">
                  Assine nossa newsletter para ofertas e atualizações exclusivas
                </label>
              </div>

              <div class="form-check mb-4" style="font-family: 'Plus Normale';">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">
                  Concordo com os <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>
                </label>
              </div>

              <div class="d-grid">
                <button type="submit" id="btnEnviar" class="btn btn-primary">Confirmar</button>
              </div>

            </form>

            <div class="container mt-4", id="divbaseAlerta">
              <div id="mensagem-alerta" class="alert d-none" role="alert">
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            </div>

          </div>
          <div class="col-md-auto"></div>
        </div>

      </div>
      <div class="col"></div>
    </div>
  </div>

  <script>
    const API_URL = "/nova_conta";
    const frmRegistro = document.getElementById("frmRegistro");
    const btn = document.getElementById("btnEnviar");
    const divAlerta = document.getElementById("mensagem-alerta");

    // Enviar novo ou atualizar
    frmRegistro.onsubmit = async (e) => {
      e.preventDefault();
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      // Desativa os campos
      document.getElementById("nome").disabled = true;
      document.getElementById("email").disabled = true;
      document.getElementById("senha").disabled = true;
      document.getElementById("senhaconfirmada").disabled = true;
      document.getElementById("terms").disabled = true;
      document.getElementById("newsletter").disabled = true;
      btn.disabled = true;      
      btn.innerText = "Validando...";

      await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({nome, email, senha})
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          divAlerta.classList.remove('d-none');
          divAlerta.classList.add('alert-success');
          divAlerta.innerHTML = "<div class='alert  alert-dismissible fade show' role='alert'" +
                                "<p>" + data.mensagem + "</p> <a href='" + data.redirect + "' class='alert-link'>Clique aqui para fazer login.</a>" +
                                "<button type='button' class='btn-close' data-bs-dismiss='alert' aria-label='Fechar'></button>" +
                                "</div>";
        } else {
          divAlerta.classList.remove('d-none');
          divAlerta.classList.add('alert-danger');
          divAlerta.textContent = data.mensagem;
        }
      });
      frmRegistro.reset();
    };

  </script>

</body>
</html>
