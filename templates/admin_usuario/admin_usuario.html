  {% include '/admin_header.html' %}
  {% include '/admin_menu.html' %}
  {% include '/admin_sidebar.html' %}

  <div class="main-content">
    <div class="container-fluid">
      <h3>Gerenciamento de Usuários</h3>
      <p>Aqui vai encontrar todos os USUÁRIOS da aplicação.</p>

      <!-- Tabela de Usuaários -->
      <div class="table-section">
        <div class="row">
          <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
              <thead class="table-light">
                <tr>
                  <th style="width: 100px;">#</th>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Tipo</th>
                  <th class="text-center" style="width: 200px;">Ações</th>
                </tr>
              </thead>
              <tbody id="listaUsuario"></tbody>
            </table>
          </div>
        </div>
      </div>  

    </div>
  </div>
    
  <script type="text/javascript" >
    const API_URL_PAGINA = "/usuario/";
    const listaUsuario = document.getElementById('listaUsuario'); 

    async function carregarUsuarios() {

      // carregando tabela
      const resposta = await fetch(API_URL_PAGINA + `usuarios`);
      const retorno = await resposta.json();
      const usuarios = retorno.dados;      

      if(usuarios){
        
        listaUsuario.innerHTML = "";
          usuarios.forEach(usuario => {
              listaUsuario.innerHTML += `
                    <tr>
                      <th>${usuario.idusuario}</th>
                      <th>${usuario.nome}</th>
                      <th>${usuario.email}</th>
                      <th>${usuario.tipo}</th>
                      <th>
                        <button class="btn btn-sm btn-light" onclick="detalhe(${usuario.idusuario})">Detalhe</button>
                        <button class="btn btn-sm btn-primary" onclick="editar(${usuario.idusuario})">alterar</button>
                        <button class="btn btn-sm btn-danger" onclick="excluir(${usuario.idusuario})">Excluir</button>
                      </th>
                    </tr>
                  `;
          });

      }
    }

    async function detalhe(id) {
      window.location.href = API_URL_PAGINA + 'ver/' + id;     
    }

    async function editar(id) {
      window.location.href = API_URL_PAGINA + 'editar/' + id;     
    }

    carregarUsuarios();
  </script>
