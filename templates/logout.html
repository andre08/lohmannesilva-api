<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Feature Store</title>
  <meta name="description" content="City Feature Store - Conhecendo de Cidades em detalhes">
  <meta name="keywords" content="Feature Store;Cidades">

  <!-- Favicons -->
  <link href="/static/img/simbolo.png" rel="icon">
  <link href="/static/img/simbolo.png" rel="apple-touch-icon">

  <!-- Main CSS File -->
  <link href="/static/css/main.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="/static/img/Logo_cor_transp.png" alt="Logo" width="183" height="40" class="d-inline-block align-text-top">
      </a>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <ul class="nav justify-content-end">
        <div class="navbar-nav justify-content-end">
          <a class="nav-link" href="#">Features</a>
          <a class="nav-link" href="#">Servicos</a>
          <a class="nav-link" href="#">Valores</a>
          <a class="nav-link" href="#">Contato</a>
          <a class="nav-link" href="#">Área restrita</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row justify-content-md-center">

      <div class="col">
        <div class="row justify-content-md-center">
          <div class="col-md-auto"></div>
          <div class="col col-8 registro-container ">
            
            <div class="mb-3 text-center" style="font-family: 'Plus Normale';">
              <h3>Cria uma nova conta de acesso</h3>
              <p>Você precisa de uma conta para acessar a área restrita</p>
            </div>

            <form>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="informe seu nome">
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@example.com">
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Informe sua senha">
                <div class="form-text">
                  Deve ter pelo menos 8 caracteres e incluir letras maiúsculas, minúsculas, números e caracteres especiais
                </div>
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="senhaconfirmada" class="form-label">Confirme a senha</label>
                <input type="password" class="form-control" id="senhaconfirmada" name="senhaconfirmada" placeholder="Repita sua senha">
              </div>

              <div class="form-check mb-2" style="font-family: 'Plus Normale';">
                <input class="form-check-input" type="checkbox" id="newsletter">
                <label class="form-check-label" for="newsletter">
                  Assine nossa newsletter para ofertas e atualizações exclusivas
                </label>
              </div>

              <div class="form-check mb-4" style="font-family: 'Plus Normale';">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">
                  Concordo com os <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>
                </label>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Confirmar</button>
              </div>

            </form>

          </div>
          <div class="col-md-auto"></div>
        </div>
      </div>

      <div class="col"> 
        
        <div class="row justify-content-md-center">
          <div class="col-md-auto"></div>
          <div class="col col-8 registro-container ">
            
            <div class="mb-3 text-center" style="font-family: 'Plus Normale';">
              <h3>Acesso a área restrica</h3>
              <p>Informe seus dados de acesso</p>
            </div>

            <form>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@example.com">
              </div>

              <div class="mb-3" style="font-family: 'Plus Normale';">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Informe sua senha">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Confirmar</button>
              </div>

            </form>

          </div>
          <div class="col-md-auto"></div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
