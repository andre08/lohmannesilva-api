  {% include 'index_header.html' %}    
  {% include 'index_menu.html' %}
  {% from "components/campos.html" import campo %}

  <div class="container-fluid">
    
    <div class="row justify-content-md-center">

      <div class="col-12 col-sm-8 col-md-6 col-lg-4 login-container">
        
        <div class="mb-3 text-center">
          <h3 style="font-family: 'DIN';">Acesso a área restrita</h3>
          <p style="font-family: 'DIN';">Informe seus dados de acesso</p>
        </div>

        <form id="formLogon">
          {{ form.csrf_token }}

          <div class="mb-3 form-text-font">
            {{ campo(form.email) }}
          </div>

          <div class="mb-3 form-text-font">
            {{ campo(form.senha) }}
          </div>

          <div class="d-grid form-text-font">
            <div class="row">
              <div class="col col-4 text-center">
                <button type="submit" class="btn btn-primary btn-sm">Acessar</button>
              </div>
              <div class="col col-8 text-center">
                <a href="{{ url_for('routes_web_usuario.rota_usuario_registro')}}">Nova conta</a>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "/usuario/";
    const formLogon = document.getElementById("formLogon");
    const divAlerta = document.getElementById("mensagem-alerta");

    // Enviar novo ou atualizar
    formLogon.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      await fetch(API_URL + 'logon', {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
          , "X-CSRFToken": "{{ form.csrf_token._value() }}"
        },
        body: JSON.stringify({email, senha})
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          exibirMensagem(data.mensagem);
        }
      });
      formLogon.reset();
    };

  </script>
  {% include 'index_footer.html' %}
