<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Feature Store</title>
  <meta name="description" content="City Feature Store - Conhecendo de Cidades em detalhes">
  <meta name="keywords" content="Feature Store;Cidades">

  <!-- Favicons -->
  <link href="/static/img/simbolo.png" rel="icon">
  <link href="/static/img/simbolo.png" rel="apple-touch-icon">

  <!-- Main CSS File -->
  <link href="/static/css/main.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
  <div class="container-fluid">

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        teste
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item active">
            <a class="nav-link" href="{{ url_for('home') }}">Principal</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Bases de dados</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Servicos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contato</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-area" href="{{ url_for('admin') }}">Área restrita</a>
          </li>
        </ul>
      </div>
    </nav>

    <br>
    
    <div class="row justify-content-md-center">

      <div class="col"></div>
      <div class="col"> 
        
        <div class="row justify-content-md-center">
          <div class="col-md-auto"></div>
            <div class="col col-8 registro-container ">
              
              <div class="mb-3 text-center">
                <h3 style="font-family: 'DeFontePlus';">Acesso a área restrita</h3>
                <p style="font-family: 'DIN';">Informe seus dados de acesso</p>
              </div>

              <form id="formLogon">

                <div class="mb-3 form-text-font">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="seuemail@example.com">
                </div>

                <div class="mb-3 form-text-font">
                  <label for="senha" class="form-label">Senha</label>
                  <input type="password" class="form-control" id="senha" name="senha" placeholder="Informe sua senha">
                </div>

                <div class="d-grid form-text-font">
                  <div class="row">
                    <div class="col col-4 text-center">
                      <button type="submit" class="btn btn-primary btn-sm">Acessar</button>
                    </div>
                    <div class="col col-8 text-center">
                      <a href="{{ url_for('routes_web_usuario.registro')}}">Nova conta</a>
                    </div>
                  </div>
                </div>

              </form>

              <div class="container mt-4">
                <div id="mensagem-alerta" class="alert alert-danger d-none" role="alert">
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              </div>

            </div>
            <div class="col-md-auto"></div>
          </div>

        </div>
      <div class="col"></div>
    </div>
  </div>

  <script>
    const API_URL = "/logon";
    const formLogon = document.getElementById("formLogon");
    const divAlerta = document.getElementById("mensagem-alerta");

    // Enviar novo ou atualizar
    formLogon.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email, senha})
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          divAlerta.classList.remove('d-none');
          divAlerta.classList.add('alert-danger');
          divAlerta.textContent = data.mensagem;
        }
      });
      formLogon.reset();
    };

  </script>

</body>
</html>
